name: Sync kernel versions

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kernel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Get upstream kernel version
        run: |
          ver=$(curl -sfL https://raw.githubusercontent.com/home-assistant/operating-system/main/buildroot-external/configs/green_defconfig \
            | sed -n 's/^BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="\([^"]*\)".*/\1/p')
          if [ -z "$ver" ]; then
            echo "::error::无法从上游 green_defconfig 提取内核版本"
            exit 1
          fi
          echo "UPSTREAM_KERNEL=$ver" >> $GITHUB_ENV

      - name: Update defconfigs
        run: |
          sed -i "s/^BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE=.*/BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE=\"${UPSTREAM_KERNEL}\"/" \
            buildroot-external/configs/orangepi_cm4_defconfig \
            buildroot-external/configs/panther_x2_defconfig
          git diff --stat

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: chore/kernel-sync
          delete-branch: true
          commit-message: "sync kernel: orangepi_cm4/panther_x2 → ${{ env.UPSTREAM_KERNEL }}"
          title: "sync kernel: orangepi_cm4/panther_x2 → ${{ env.UPSTREAM_KERNEL }}"
          body: |
            自动同步内核版本（每日检查，无变化时不创建 PR）：
            - orangepi_cm4 / panther_x2: 跟随上游 [home-assistant/operating-system main](https://github.com/home-assistant/operating-system/blob/main/buildroot-external/configs/green_defconfig) → **${{ env.UPSTREAM_KERNEL }}**
