name: Rootfs diff analysis (test)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target to analyze'
        required: false
        default: 'generic_x86_64'
      upstream_ref:
        description: 'Upstream operating-system ref to clone'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout private repo
        uses: actions/checkout@v7
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Free up disk space
        run: |
          chmod +x private/*.sh
          sudo private/release_space.sh
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Clone upstream and apply CN overlay
        run: |
          git clone https://github.com/home-assistant/operating-system.git -b "${{ inputs.upstream_ref || 'main' }}" operating-system
          cp -r buildroot-external operating-system
          cd operating-system
          git submodule update --init
          sed -i 's|^FallbackNTP=time.cloudflare.com$|FallbackNTP=cn.ntp.org.cn time.windows.com|' buildroot-external/rootfs-overlay/etc/systemd/timesyncd.conf

      - name: Run private build script
        run: |
          chmod +x private/*.sh
          private/haos.sh
        env:
          MATRIX_TARGET: ${{ inputs.target }}
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        shell: 'script -q -e -c "bash {0}"'
        env:
          CACHE_DIR: /mnt/cache
        run: |
          cd operating-system
          scripts/enter.sh make ${{ inputs.target }}

      - name: Diff our rootfs against official release
        if: always()
        run: |
          IMG=operating-system/output/images/rootfs.erofs
          HOSTBIN=operating-system/output/host/bin
          if [ ! -f "$IMG" ] || [ ! -x "$HOSTBIN/fsck.erofs" ]; then
            echo "rootfs.erofs or fsck.erofs missing, cannot analyze"
            exit 0
          fi
          mkdir -p analysis
          TAG=$(curl -s https://api.github.com/repos/home-assistant/operating-system/releases/latest | jq -r '.tag_name')
          echo "official release: $TAG"
          curl -sfL -o /tmp/official.raucb "https://github.com/home-assistant/operating-system/releases/download/${TAG}/haos_generic-x86-64-${TAG}.raucb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          unsquashfs -n -d /tmp/official_extract /tmp/official.raucb rootfs.img >/dev/null
          OFFICIAL=/tmp/official_extract/rootfs.img
          rm -rf /tmp/off_tree /tmp/our_tree
          "$HOSTBIN/fsck.erofs" --extract=/tmp/off_tree "$OFFICIAL" >/dev/null 2>&1 || true
          "$HOSTBIN/fsck.erofs" --extract=/tmp/our_tree "$IMG" >/dev/null 2>&1 || true
          (cd /tmp/off_tree && find . -type f -printf '%s\t%p\n' | sort -k2) > analysis/official_files.txt
          (cd /tmp/our_tree && find . -type f -printf '%s\t%p\n' | sort -k2) > analysis/our_files.txt
          python3 - <<'EOF' | tee analysis/report.txt
          import collections
          def load(p):
              d = {}
              for line in open(p, encoding='utf-8', errors='replace'):
                  parts = line.rstrip('\n').split('\t', 1)
                  if len(parts) == 2:
                      d[parts[1]] = int(parts[0])
              return d
          off = load('analysis/official_files.txt')
          our = load('analysis/our_files.txt')
          print(f'official: {len(off)} files, {sum(off.values()):,} bytes (raw)')
          print(f'ours:     {len(our)} files, {sum(our.values()):,} bytes (raw)')
          only_our = {k: our[k] for k in our.keys() - off.keys()}
          only_off = {k: off[k] for k in off.keys() - our.keys()}
          changed = {k: (off[k], our[k]) for k in off.keys() & our.keys() if off[k] != our[k]}
          print(f'\n== files only in OURS ({len(only_our)}) ==')
          for k, v in sorted(only_our.items(), key=lambda x: -x[1]):
              print(f'  +{v:>10,}  {k}')
          print(f'\n== files only in OFFICIAL ({len(only_off)}) ==')
          for k, v in sorted(only_off.items(), key=lambda x: -x[1]):
              print(f'  -{v:>10,}  {k}')
          print(f'\n== files with different size ({len(changed)}) ==')
          tot = 0
          for k, (a, b) in sorted(changed.items(), key=lambda x: -(x[1][1] - x[1][0])):
              d = b - a
              tot += d
              print(f'  {d:>+12,}  {k}  (official {a:,} -> ours {b:,})')
          print(f'\nnet raw delta from changed files: {tot:+,}')
          EOF
          # 深挖:对比差异最大的内核模块的 ELF section 表与文件尾部(模块签名)
          sudo apt-get install -y -qq binutils >/dev/null 2>&1 || true
          KO_REL=usr/lib/modules/6.18.58-haos/kernel/drivers/gpu/drm/amd/amdgpu/amdgpu.ko
          if [ -f /tmp/off_tree/$KO_REL ] && [ -f /tmp/our_tree/$KO_REL ]; then
            readelf -S /tmp/off_tree/$KO_REL > analysis/official_amdgpu_sections.txt 2>&1 || true
            readelf -S /tmp/our_tree/$KO_REL > analysis/our_amdgpu_sections.txt 2>&1 || true
            diff -u analysis/official_amdgpu_sections.txt analysis/our_amdgpu_sections.txt > analysis/amdgpu_sections.diff || true
            echo "=== amdgpu.ko section diff ===" | tee -a analysis/report.txt
            cat analysis/amdgpu_sections.diff | tee -a analysis/report.txt
            tail -c 2048 /tmp/off_tree/$KO_REL | xxd > analysis/official_amdgpu_tail.txt 2>/dev/null || true
            tail -c 2048 /tmp/our_tree/$KO_REL | xxd > analysis/our_amdgpu_tail.txt 2>/dev/null || true
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-analysis
          path: |
            analysis/
            operating-system/output/images/rootfs.erofs
          retention-days: 5
          if-no-files-found: ignore
