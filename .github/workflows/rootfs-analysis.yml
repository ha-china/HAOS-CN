name: Rootfs diff analysis (test)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target to analyze'
        required: false
        default: 'generic_x86_64'
      upstream_ref:
        description: 'Upstream operating-system ref to clone'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout private repo
        uses: actions/checkout@v7
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Free up disk space
        run: |
          chmod +x private/*.sh
          sudo private/release_space.sh
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Clone upstream and apply CN overlay
        run: |
          git clone https://github.com/home-assistant/operating-system.git -b "${{ inputs.upstream_ref || 'main' }}" operating-system
          cp -r buildroot-external operating-system
          cd operating-system
          git submodule update --init
          sed -i 's|^FallbackNTP=time.cloudflare.com$|FallbackNTP=cn.ntp.org.cn time.windows.com|' buildroot-external/rootfs-overlay/etc/systemd/timesyncd.conf

      - name: Run private build script
        run: |
          chmod +x private/*.sh
          private/haos.sh
        env:
          MATRIX_TARGET: ${{ inputs.target }}
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        shell: 'script -q -e -c "bash {0}"'
        env:
          CACHE_DIR: /mnt/cache
        run: |
          cd operating-system
          scripts/enter.sh make ${{ inputs.target }}

      - name: Diff our rootfs against official release
        if: always()
        run: |
          IMG=operating-system/output/images/rootfs.erofs
          DUMP=operating-system/output/host/bin/dump.erofs
          if [ ! -f "$IMG" ] || [ ! -x "$DUMP" ]; then
            echo "rootfs.erofs or dump.erofs missing, cannot analyze"
            exit 0
          fi
          mkdir -p analysis
          TAG=$(curl -s https://api.github.com/repos/home-assistant/operating-system/releases/latest | jq -r '.tag_name')
          echo "official release: $TAG"
          curl -sfL -o /tmp/official.raucb "https://github.com/home-assistant/operating-system/releases/download/${TAG}/haos_generic-x86-64-${TAG}.raucb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          unsquashfs -n -d /tmp/official_extract /tmp/official.raucb rootfs.img >/dev/null
          OFFICIAL=/tmp/official_extract/rootfs.img
          {
            echo "=== SIZE ==="
            stat -c '%s %n' "$OFFICIAL" "$IMG"
            echo "=== OFFICIAL SUMMARY ==="
            "$DUMP" -s "$OFFICIAL" 2>&1
            echo "=== OURS SUMMARY ==="
            "$DUMP" -s "$IMG" 2>&1
          } | tee analysis/report.txt
          "$DUMP" "$OFFICIAL" > analysis/official_dump.txt 2>&1 || true
          "$DUMP" "$IMG" > analysis/ours_dump.txt 2>&1 || true
          norm() { sed -E 's/0x[0-9a-fA-F]+//g; s/\b1[0-9]{9}\b//g' "$1"; }
          norm analysis/official_dump.txt > /tmp/off.norm
          norm analysis/ours_dump.txt > /tmp/ours.norm
          diff -u /tmp/off.norm /tmp/ours.norm > analysis/list.diff || true
          {
            echo "=== DIFF (first 100 lines) ==="
            head -100 analysis/list.diff
            echo "=== DIFF lines: $(wc -l < analysis/list.diff) ==="
          } | tee -a analysis/report.txt

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-analysis
          path: analysis/
          retention-days: 7
          if-no-files-found: ignore
